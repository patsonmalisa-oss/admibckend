# Render.com Deployment Configuration
services:
  - type: web
    name: admibackend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PYTHON_SERVICE_HOST
        value: 127.0.0.1
      - key: PYTHON_SERVICE_PORT
        value: 5001
      - key: JWT_SECRET
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
    # Docker context and file path (relative to repo root)
    dockerContext: .
    dockerfilePath: Dockerfile
